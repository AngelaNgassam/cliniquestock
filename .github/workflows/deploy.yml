name: Deploy to O2Switch (FTP)

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cliniquestock
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- Frontend CI ---
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      # --- Backend CI ---
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint Backend
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
        continue-on-error: true

      - name: Check Django Project
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: cdiu8226_djiatou
          DB_PASSWORD: Ngnipicba@12345
          DB_NAME: cdiu8226_cliniques_db
          SECRET_KEY: test-secret-key-for-github-actions
        run: python manage.py check
        continue-on-error: true

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: cdiu8226_djiatou
          DB_PASSWORD: Ngnipicba@12345
          DB_NAME: cdiu8226_cliniques_db
          SECRET_KEY: test-secret-key-for-github-actions
        run: python manage.py test
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ngnipicba.cdwfs.net/cliniquestock-api/api/v1' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}

      # --- Déploiement du Frontend via FTP ---
      - name: Deploy Frontend to public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          # Chemin relatif à la racine de votre connexion FTP
          server-dir: public_html/ngnipicba/cliniquestock/
          dangerous-clean-slate: false

      # --- Préparation du Backend ---
      - name: Inject Production .env
        working-directory: ./backend
        run: |
          echo "${{ secrets.PROD_ENV_FILE }}" > .env

      # Création locale du dossier tmp et du fichier de redémarrage pour Passenger
      - name: Prepare Passenger Restart File
        working-directory: ./backend
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      # --- Déploiement du Backend via FTP ---
      - name: Deploy Backend to Python App via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: apps/cliniquestock_backend/
          dangerous-clean-slate: false
          # On exclut l'environnement virtuel local s'il existe et les fichiers inutiles
          exclude: |
            **/venv/**
            **/.git/**
            **/.github/**
            **/__pycache__/**
            **/db.sqlite3