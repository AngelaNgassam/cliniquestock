name: Deploy to O2Switch

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cliniquestock
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- Frontend CI ---
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      # --- Backend CI ---
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint Backend
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
        continue-on-error: true

      - name: Check Django Project
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: cdiu8226_djiatou
          DB_PASSWORD: Ngnipicba@12345
          DB_NAME: cdiu8226_cliniques_db
          SECRET_KEY: test-secret-key-for-github-actions
        run: python manage.py check
        continue-on-error: true

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: cdiu8226_djiatou
          DB_PASSWORD: Ngnipicba@12345
          DB_NAME: cdiu8226_cliniques_db
          SECRET_KEY: test-secret-key-for-github-actions
        run: python manage.py test
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ngnipicba.cdwfs.net/cliniquestock-api/api/v1' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}

      - name: Get Runner IP
        id: ip
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "runner_ip=$RUNNER_IP" >> $GITHUB_OUTPUT
          echo "L'IP temporaire du Runner GitHub est : $RUNNER_IP"

      - name: Whitelist GitHub Runner IP on O2switch Firewall
        run: |
          curl -H "Authorization: cpanel ${{ secrets.O2SWITCH_USER }}:${{ secrets.O2SWITCH_API_TOKEN }}" \
          "https://${{ secrets.O2SWITCH_HOST }}:2083/execute/FileAuth/list_authorizations" \
          --data-urlencode "ip=${{ steps.ip.outputs.runner_ip }}" \
          --data-urlencode "service=ssh" \
          --data-urlencode "action=allow" || echo "Tentative d'ouverture de l'IP via l'API"
          # Petite pause de 5 secondes pour laisser le pare-feu appliquer la règle
          sleep 5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.O2SWITCH_SSH_KEY }}

      - name: Deploy Frontend to public_html via Rsync
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15" ./frontend/dist/ ${{ secrets.O2SWITCH_USER }}@${{ secrets.O2SWITCH_HOST }}:/home/${{ secrets.O2SWITCH_USER }}/public_html/ngnipicba/cliniquestock/

      - name: Inject Production .env
        working-directory: ./backend
        run: |
          echo "${{ secrets.PROD_ENV_FILE }}" > .env

      - name: Deploy Backend to Python App via Rsync
        run: |
          rsync -avz --delete --exclude 'venv' --exclude '__pycache__' --exclude 'media' --exclude 'db.sqlite3' -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15" ./backend/ ${{ secrets.O2SWITCH_USER }}@${{ secrets.O2SWITCH_HOST }}:/home/${{ secrets.O2SWITCH_USER }}/apps/cliniquestock_backend/

      - name: Execute post-deploy scripts (Install dependencies, Migrate, Restart)
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 ${{ secrets.O2SWITCH_USER }}@${{ secrets.O2SWITCH_HOST }} << 'EOF'
            # Activer l'environnement virtuel créé par cPanel
            source /home/${{ secrets.O2SWITCH_USER }}/virtualenv/apps/cliniquestock_backend/3.12/bin/activate
            
            # Aller dans le dossier du backend
            cd /home/${{ secrets.O2SWITCH_USER }}/apps/cliniquestock_backend/
            
            # Installer les paquets
            pip install -r requirements.txt
            
            # Migrer la base de données
            python manage.py migrate
            
            # Collecter les fichiers statiques (Django admin)
            python manage.py collectstatic --noinput
            
            # Redémarrer Passenger
            mkdir -p tmp
            touch tmp/restart.txt
          EOF

      # --- Nettoyage de sécurité : on retire l'IP du pare-feu à la fin (Même si le build échoue avant) ---
      - name: Remove GitHub Runner IP from Whitelist
        if: always()
        run: |
          curl -H "Authorization: cpanel ${{ secrets.O2SWITCH_USER }}:${{ secrets.O2SWITCH_API_TOKEN }}" \
          "https://${{ secrets.O2SWITCH_HOST }}:2083/execute/FileAuth/list_authorizations" \
          --data-urlencode "ip=${{ steps.ip.outputs.runner_ip }}" \
          --data-urlencode "service=ssh" \
          --data-urlencode "action=remove" || echo "Nettoyage de l'IP terminé"